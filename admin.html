<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Studio | Dreamscape HD</title><link rel="stylesheet" href="assets/style.css"></head><body class="admin-body"><main class="admin-shell"><header class="admin-header"><a class="logo" href="/">DREAMSCAPE <i>HD</i></a><button id="logout" class="hidden">Sign out</button></header><section id="login" class="admin-panel login"><p class="eyebrow">PRIVATE STUDIO</p><h1>Welcome back.</h1><form id="login-form"><label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label><p id="login-error" class="error"></p><button class="button">Enter studio</button></form></section><section id="dashboard" class="hidden"><div class="admin-panel"><p class="eyebrow">PUBLISHING DESK</p><h1>Collections</h1><div id="stats" class="admin-grid"></div><div class="toolbar"><button id="new-post" class="button">New collection +</button><span id="status-note"></span></div><table class="admin-list"><thead><tr><th>Title</th><th>Status</th><th>Updated</th><th></th></tr></thead><tbody id="article-list"></tbody></table></div><section id="editor" class="admin-panel editor"><div class="toolbar"><h1 id="editor-title">New collection</h1><button id="close-editor">Close</button></div><p class="notice">One collage preview only. Your full wallpaper pack remains securely on Gumroad.</p><form id="post-form"><input name="id" type="hidden"><div class="two-cols"><label class="field"><span>Article title</span><input name="title" required maxlength="140"></label><label class="field"><span>URL slug</span><input name="slug" required pattern="[a-z0-9-]+" maxlength="160"></label></div><div class="two-cols"><label class="field"><span>Category</span><input name="category" required maxlength="50" placeholder="e.g. Abstract"></label><label class="field"><span>Gumroad download URL</span><input name="downloadUrl" type="url" required placeholder="https://gumroad.com/..." ></label></div><label class="field"><span>Short description</span><textarea name="excerpt" required maxlength="300"></textarea></label><label class="field"><span>Content (Markdown: ## heading, **bold**, *italic*, links)</span><textarea name="content" required></textarea></label><label class="field"><span>Collage image <small>(JPG, PNG, WebP, SVG — max 5 MB)</small></span><input id="image" name="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/svg+xml"><img id="image-preview" class="image-preview hidden" alt="Collage preview"><input name="image" type="hidden"></label><div class="two-cols"><label class="field"><span>SEO title</span><input name="seoTitle" maxlength="160"></label><label class="field"><span>SEO description</span><input name="seoDescription" maxlength="170"></label></div><div class="toolbar"><label class="field"><span>Save as</span><select name="status"><option value="draft">Draft</option><option value="published">Published</option></select></label><div><button type="button" id="preview">Preview</button> <button class="button">Save collection</button></div></div><p id="form-error" class="error"></p></form></section></section></main><script src="assets/admin.js"></script></body></html>
